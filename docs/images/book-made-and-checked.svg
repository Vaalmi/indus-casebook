<svg xmlns="http://www.w3.org/2000/svg" width="1272" height="470" viewBox="0 0 1272 470" role="img" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title>How a book is made and checked</title>
<desc>Seed 2026 and the committed scripts build 92 households in ten archetypes, each with four source sets and a sealed layer. casebook check runs nine checks per household; the gates check the notice, aliases, the private set and watermarks; only then are the site, the plugin's sample book and the release written.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6670"/></marker>

</defs>
<rect x="0.5" y="0.5" width="1271" height="469" rx="12" fill="#ffffff" stroke="#d9dee3"/>
<text x="32" y="44" font-size="22" fill="#1d2329" font-weight="700">How a book is made and checked</text>
<text x="32" y="70" font-size="13" fill="#1d2329">One seed and one version give byte-identical files. A household that fails a check is never published.</text>
<rect x="32" y="110" width="180" height="92" rx="8" fill="#e8f1f8" stroke="#1f5f8b"/>
<text x="46" y="134" font-size="15" fill="#1f5f8b" font-weight="700">Seed 2026</text>
<text x="46" y="156" font-size="13" fill="#5b6670">uv run casebook</text>
<text x="46" y="174" font-size="13" fill="#5b6670">build --seed 2026</text>
<rect x="32" y="226" width="180" height="110" rx="8" fill="#f5f7f9" stroke="#d9dee3"/>
<text x="46" y="250" font-size="15" fill="#1d2329" font-weight="700">Scripts and ledger</text>
<text x="46" y="272" font-size="13" fill="#5b6670">book/scripted/</text>
<text x="46" y="290" font-size="13" fill="#5b6670">book/id_ledger.json</text>
<text x="46" y="308" font-size="13" fill="#5b6670">IDs never change</text>
<path d="M212 156 L256 156" stroke="#5b6670" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M212 281 L234 281 L234 170 L256 170" stroke="#5b6670" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="256" y="110" width="236" height="226" rx="8" fill="#f5f7f9" stroke="#d9dee3"/>
<text x="270" y="134" font-size="15" fill="#1d2329" font-weight="700">92 households</text>
<text x="270" y="156" font-size="13" fill="#5b6670">10 archetypes, in pairs:</text>
<text x="270" y="174" font-size="13" fill="#5b6670">a trap with a planted item,</text>
<text x="270" y="192" font-size="13" fill="#5b6670">and its twin: clean, a near</text>
<text x="270" y="210" font-size="13" fill="#5b6670">miss or unresolved</text>
<text x="270" y="228" font-size="13" fill="#5b6670"></text>
<text x="270" y="246" font-size="13" fill="#5b6670">20 featured, 72 background</text>
<text x="270" y="264" font-size="13" fill="#5b6670"></text>
<text x="270" y="282" font-size="13" fill="#5b6670">History replayed from</text>
<text x="270" y="300" font-size="13" fill="#5b6670">1 Jan 2025 to 15 Apr 2026</text>
<path d="M492 223 L536 223" stroke="#5b6670" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="536" y="102" font-size="13" fill="#5b6670" font-weight="700">Four source sets per household</text>
<rect x="536" y="110" width="250" height="50" rx="8" fill="#f5f7f9" stroke="#d9dee3"/>
<text x="550" y="131" font-size="14" fill="#1d2329" font-weight="700">Custodian</text>
<text x="550" y="150" font-size="12" fill="#5b6670">CSVs: positions, lots, cash</text>
<rect x="536" y="168" width="250" height="50" rx="8" fill="#f5f7f9" stroke="#d9dee3"/>
<text x="550" y="189" font-size="14" fill="#1d2329" font-weight="700">Portfolio system</text>
<text x="550" y="208" font-size="12" fill="#5b6670">JSON: IPS, fees, billing</text>
<rect x="536" y="226" width="250" height="50" rx="8" fill="#f5f7f9" stroke="#d9dee3"/>
<text x="550" y="247" font-size="14" fill="#1d2329" font-weight="700">CRM</text>
<text x="550" y="266" font-size="12" fill="#5b6670">JSON: contacts, notes</text>
<rect x="536" y="284" width="250" height="50" rx="8" fill="#f5f7f9" stroke="#d9dee3"/>
<text x="550" y="305" font-size="14" fill="#1d2329" font-weight="700">Documents</text>
<text x="550" y="324" font-size="12" fill="#5b6670">PDFs: statements, 1099s</text>
<rect x="536" y="354" width="250" height="92" rx="8" fill="#ffffff" stroke="#d9dee3" stroke-dasharray="6 4"/>
<text x="550" y="378" font-size="15" fill="#1d2329" font-weight="700">Sealed</text>
<text x="550" y="400" font-size="13" fill="#5b6670">event log, registry, tax summary:</text>
<text x="550" y="418" font-size="13" fill="#5b6670">never shown to the AI under test</text>
<path d="M786 223 L830 223" stroke="#5b6670" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="830" y="110" width="170" height="120" rx="8" fill="#e8f1f8" stroke="#1f5f8b"/>
<text x="844" y="134" font-size="15" fill="#1f5f8b" font-weight="700">casebook check</text>
<text x="844" y="156" font-size="13" fill="#5b6670">nine checks per</text>
<text x="844" y="174" font-size="13" fill="#5b6670">household, each</text>
<text x="844" y="192" font-size="13" fill="#5b6670">pass or fail</text>
<rect x="830" y="254" width="170" height="136" rx="8" fill="#f5f7f9" stroke="#d9dee3"/>
<text x="844" y="278" font-size="15" fill="#1d2329" font-weight="700">Gates</text>
<text x="844" y="300" font-size="13" fill="#5b6670">the notice</text>
<text x="844" y="318" font-size="13" fill="#5b6670">aliases only</text>
<text x="844" y="336" font-size="13" fill="#5b6670">no private set</text>
<text x="844" y="354" font-size="13" fill="#5b6670">watermarked forms</text>
<path d="M915 230 L915 254" stroke="#5b6670" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="830" y="418" font-size="12" fill="#b3261e" font-weight="700">A fail stops here:</text>
<text x="830" y="436" font-size="12" fill="#b3261e">nothing is published</text>
<rect x="1044" y="110" width="196" height="76" rx="8" fill="#f5f7f9" stroke="#d9dee3"/>
<text x="1058" y="134" font-size="15" fill="#1d2329" font-weight="700">Site</text>
<text x="1058" y="156" font-size="13" fill="#5b6670">out/site/</text>
<path d="M1000 322 L1022 322 L1022 148 L1044 148" stroke="#5b6670" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="1044" y="210" width="196" height="76" rx="8" fill="#f5f7f9" stroke="#d9dee3"/>
<text x="1058" y="234" font-size="15" fill="#1d2329" font-weight="700">Plugin sample book</text>
<text x="1058" y="256" font-size="13" fill="#5b6670">plugin/book/</text>
<path d="M1000 322 L1022 322 L1022 248 L1044 248" stroke="#5b6670" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="1044" y="310" width="196" height="76" rx="8" fill="#f5f7f9" stroke="#d9dee3"/>
<text x="1058" y="334" font-size="15" fill="#1d2329" font-weight="700">Release bundle</text>
<text x="1058" y="356" font-size="13" fill="#5b6670">out/release/v0.1.0/</text>
<path d="M1000 322 L1022 322 L1022 348 L1044 348" stroke="#5b6670" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
</svg>
