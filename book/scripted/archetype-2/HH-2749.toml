[twin]
kind = "near_miss"
explanation = "A near miss. Samira and Patrick's wages are a little under the net investment income tax threshold for joint filers, their joint account pays dividends, and in December 2025 they sold part of a fund held since 2010 at a gain. That looks like the threshold trap, but the sale was small: wages plus dividends and the gain in the joint account, their only income, leave modified AGI under the threshold, so no net investment income tax is owed for 2025. Their IRAs' dividends are not income. The SALT limit applies in full. The bond fund in the taxable account while the IRAs hold equity funds is still worth raising as asset location."
