[twin]
kind = "near_miss"
explanation = "A near miss. Daniel made a backdoor Roth: a $7,000 nondeductible contribution to a new traditional IRA, converted to his Roth IRA three days later. That looks like the pro-rata trap, because he has a large pre-tax balance. But it sits in his former employer's 401(k), and Form 8606 line 6 counts only traditional, SEP and SIMPLE IRAs. His only traditional IRA was empty on 31 December 2025, so line 10 is 1.000, the whole $7,000 conversion is nontaxable, and no basis carries to 2026."
