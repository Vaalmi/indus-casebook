[twin]
kind = "unresolved"
explanation = "Unresolved. Beatriz converted $60,000 from her traditional IRA to her Roth IRA on 7 November 2025. Her 2024 return carries no IRA basis, so on the records the whole conversion is taxable. But she told her advisor she made nondeductible contributions in the late 1990s, and no Form 8606 is on file to prove or rule out that basis. If she has basis, part of the conversion is nontaxable under the pro-rata rule of IRC § 408(d)(2); if not, all of it is taxable. The taxable part cannot be settled until her old Forms 8606 or returns are found; the right answer is to say so and ask for them, not to assume either way."
