# The task matrix: which public task sits on which household (docs/PLAN.md, New names).
# DRAFT for the owner's approval (slice 5). Each workflow's six tasks are two trap-and-twin task
# pairs and two book-level tasks (docs/PLAN.md, Choices). The eight private tasks, two per
# workflow, are in the private repo's matrix, on background pairs.
#
# role: "trap" or "twin" for a task on a featured pair (`pair_task` is its partner on the other
# household of the pair), "book" for a task over the whole book. Tasks are written in slices 9
# and 10; only T-REC-01 exists so far.

