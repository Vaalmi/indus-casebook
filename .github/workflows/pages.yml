# Publishes the site from a release tag (docs/SPEC.md, Running it). Rolling back the
# site means running this workflow again on the previous tag: Actions → "Publish site"
# → Run workflow → "Use workflow from" the tag, or "Re-run all jobs" on that tag's run.
name: Publish site

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # The two builds, the check and the release take about 6.5 minutes on the owner's Mac (the release 4m52s), and a
    # GitHub runner looked about 1.75 times slower on make check (an estimate: that run was cut off at 57%, 21 November
    # 2026); the upload is the 316 MB bundle.
    timeout-minutes: 45
    steps:
      - name: Refuse anything but a release tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "The site is published only from a release tag; this run is on ${GITHUB_REF}." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          enable-cache: false
      - run: uv sync --frozen
      - name: The tag names the package version
        run: test "v$(uv version --short)" = "${GITHUB_REF_NAME}"
      - run: uv run casebook build --seed 2026
      - run: uv run casebook check
      # The real-ticker build is read only by the release's gate, which refuses any file that came from it.
      - run: uv run casebook build --real-tickers
      # The release builds the site inside its bundle and gates the whole bundle (docs/PLAN.md, slice 16); it refuses
      # a tag the owner has not recorded in published/releases.json with `casebook release --preview --record`.
      - run: uv run casebook release --preview
      - name: The release's site
        run: echo "site=out/release/${GITHUB_REF_NAME}/site" >> "${GITHUB_OUTPUT}"
        id: release
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: out/release/${{ github.ref_name }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.release.outputs.site }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
