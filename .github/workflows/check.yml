name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # make check takes about 31 minutes on the owner's Mac and was 57% through at 30 minutes on a GitHub runner
    # (21 November 2026), so the limit leaves room for the whole run.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          enable-cache: false
      - name: Set up
        run: make setup PLAYWRIGHT_FLAGS=--with-deps
      - name: The one check command
        run: make check
