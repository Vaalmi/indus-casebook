# The 2025 rules table. Every value is a string parsed as a Decimal, and every
# parameter and table cites the primary source it was checked against.

year = 2025

[parameters.rmd_age]
value = "73"
citation = "26 U.S.C. § 401(a)(9)(C)(v)(I), added by SECURE 2.0 Act of 2022 § 107 (Pub. L. 117-328, div. T): applicable age 73 for an individual who attains age 72 after Dec. 31, 2022 and age 73 before Jan. 1, 2033 (born 1951 to 1959); https://www.law.cornell.edu/uscode/text/26/401"

[parameters.niit_rate]
value = "0.038"
citation = "26 U.S.C. § 1411(a)(1): tax equal to 3.8 percent; https://www.law.cornell.edu/uscode/text/26/1411"

[parameters.niit_threshold_mfj]
value = "250000"
citation = "26 U.S.C. § 1411(b)(1): joint return or surviving spouse, $250,000; https://www.law.cornell.edu/uscode/text/26/1411"

[parameters.niit_threshold_mfs]
value = "125000"
citation = "26 U.S.C. § 1411(b)(2): married filing separately, half of the § 1411(b)(1) amount; https://www.law.cornell.edu/uscode/text/26/1411"

[parameters.niit_threshold_single]
value = "200000"
citation = "26 U.S.C. § 1411(b)(3): any other case, $200,000; https://www.law.cornell.edu/uscode/text/26/1411"

[parameters.niit_threshold_hoh]
value = "200000"
citation = "26 U.S.C. § 1411(b)(3): any other case (head of household included), $200,000; https://www.law.cornell.edu/uscode/text/26/1411"

[parameters.qcd_limit]
value = "108000"
citation = "IRS Notice 2024-80 (2025 amounts): the § 408(d)(8)(A) limit on qualified charitable distributions is increased from $105,000 to $108,000; indexed under 26 U.S.C. § 408(d)(8)(G); https://www.irs.gov/pub/irs-drop/n-24-80.pdf"

[parameters.ira_contribution_limit]
value = "7000"
citation = "IRS Notice 2024-80 (2025 amounts): the deductible amount under 26 U.S.C. § 219(b)(5)(A) remains $7,000; https://www.irs.gov/pub/irs-drop/n-24-80.pdf"

[parameters.ira_catch_up]
value = "1000"
citation = "IRS Notice 2024-80 (2025 amounts): the increase under 26 U.S.C. § 219(b)(5)(B)(ii) for individuals age 50 or over remains $1,000; https://www.irs.gov/pub/irs-drop/n-24-80.pdf"

[parameters.salt_cap]
value = "40000"
citation = "26 U.S.C. § 164(b)(7)(A)(i), as amended by Pub. L. 119-21 § 70120: applicable limitation amount $40,000 for taxable years beginning in 2025; https://www.law.cornell.edu/uscode/text/26/164"

[parameters.salt_cap_mfs]
value = "20000"
citation = "26 U.S.C. § 164(b)(6)(B), as amended by Pub. L. 119-21 § 70120: half the applicable limitation amount for a married individual filing a separate return; https://www.law.cornell.edu/uscode/text/26/164"

[parameters.salt_phase_down_threshold]
value = "500000"
citation = "26 U.S.C. § 164(b)(7)(B)(ii)(I), as amended by Pub. L. 119-21 § 70120: threshold amount $500,000 for taxable years beginning in 2025; https://www.law.cornell.edu/uscode/text/26/164"

[parameters.salt_phase_down_threshold_mfs]
value = "250000"
citation = "26 U.S.C. § 164(b)(7)(B)(i), as amended by Pub. L. 119-21 § 70120: half the threshold amount for a married individual filing a separate return; https://www.law.cornell.edu/uscode/text/26/164"

[parameters.salt_phase_down_rate]
value = "0.30"
citation = "26 U.S.C. § 164(b)(7)(B)(i), as amended by Pub. L. 119-21 § 70120: reduced by 30 percent of modified AGI over the threshold amount; https://www.law.cornell.edu/uscode/text/26/164"

[parameters.salt_floor]
value = "10000"
citation = "26 U.S.C. § 164(b)(7)(B)(iii), as amended by Pub. L. 119-21 § 70120: the reduction shall not take the applicable limitation amount below $10,000; https://www.law.cornell.edu/uscode/text/26/164"

[parameters.salt_floor_mfs]
value = "5000"
citation = "26 U.S.C. § 164(b)(6)(B) with § 164(b)(7)(B)(iii), as amended by Pub. L. 119-21 § 70120: a separate filer is allowed half the applicable limitation amount, which cannot fall below $10,000; https://www.law.cornell.edu/uscode/text/26/164"

[parameters.capital_loss_limit]
value = "3000"
citation = "26 U.S.C. § 1211(b)(1): $3,000 of capital losses in excess of gains; https://www.law.cornell.edu/uscode/text/26/1211"

[parameters.capital_loss_limit_mfs]
value = "1500"
citation = "26 U.S.C. § 1211(b)(1): $1,500 for a married individual filing a separate return; https://www.law.cornell.edu/uscode/text/26/1211"

[parameters.wash_sale_days]
value = "30"
citation = "26 U.S.C. § 1091(a): a period beginning 30 days before and ending 30 days after the sale; https://www.law.cornell.edu/uscode/text/26/1091"

[parameters.inherited_ira_years]
value = "10"
citation = "26 U.S.C. § 401(a)(9)(H)(i)(I): substitute 10 years for 5 years; 26 CFR 1.401(a)(9)-5(e)(2): the calendar year that includes the tenth anniversary of the death; https://www.law.cornell.edu/uscode/text/26/401"

[parameters.annual_rmd_enforced_from]
value = "2025"
citation = "26 CFR 1.401(a)(9)-1(d) (T.D. 10001, 89 FR 58886, July 19, 2024): the final regulations apply for calendar years beginning on or after Jan. 1, 2025; IRS Notice 2024-35 § IV waives the § 4974 excise tax on specified RMDs for 2024 (Notices 2022-53 and 2023-54 for 2021 to 2023); https://www.ecfr.gov/current/title-26/section-1.401(a)(9)-1, https://www.irs.gov/pub/irs-drop/n-24-35.pdf"

