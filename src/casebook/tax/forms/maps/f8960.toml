# Form 8960 (2025), Net Investment Income Tax—Individuals, Estates, and Trusts.
# Each key is a line as the form prints it (the scheme is in casebook.tax.forms); its value is the
# PDF field that holds it. The comment after each entry is the field's own label, from the form's XFA.
#
# Left out:
# - the three elections at the top of Part I (c1_1 to c1_3), sections 6013(g), 6013(h) and
#   1.1411-10(g): no household has a nonresident spouse or a CFC or PFIC.
# - lines 18a to 21 (f1_28 to f1_35), for estates and trusts: every return in the book is an individual's.

[fields]
names = "topmostSubform[0].Page1[0].f1_1[0]"  # Name(s) shown on your tax return.
