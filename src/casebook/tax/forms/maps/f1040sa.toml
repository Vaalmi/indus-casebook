# Schedule A (Form 1040) 2025, Itemized Deductions.
# Each key is a line as the form prints it (the scheme is in casebook.tax.forms); its value is the
# PDF field that holds it. The comment after each entry is the field's own label, from the form's XFA.
#
# Left out:
# - line 8d (f1_19): "Reserved for future use".

[fields]
