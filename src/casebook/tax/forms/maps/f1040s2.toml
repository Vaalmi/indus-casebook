# Schedule 2 (Form 1040) 2025, Additional Taxes.
# Each key is a line as the form prints it (the scheme is in casebook.tax.forms); its value is the
# PDF field that holds it. The comment after each entry is the field's own label, from the form's XFA.
#
# Left out:
# - the boxes on lines 1e and 1f (c1_1, c1_2), which say which line of Form 4255 an excessive payment
#   comes from: no household has a clean-energy credit to recapture. The amounts on 1e and 1f are mapped.
# - the exemption boxes on line 4 (c1_3 to c1_5, f1_14), Forms 4361 and 4029: no household has
#   self-employment income.
# - line 10 (f1_21): "Reserved for future use".

