# Form 1040 (2025), U.S. Individual Income Tax Return.
# Each key is a line as the form prints it (the scheme is in casebook.tax.forms); its value is the
# PDF field that holds it. The comment after each entry is the field's own label, from the form's XFA.
#
# Left out:
# - the tax-year dates at the top (f1_01 to f1_03): every return is for calendar 2025.
# - the special-filing boxes "Filed pursuant to section 301.9100-2", "Combat zone" and "Other", with
#   their text (c1_1, c1_2, c1_4, f1_04, f1_11 to f1_13): no household files under them.
# - direct deposit, lines 35b to 35d (c2_16, f2_32, f2_33): the book holds no bank routing or account
#   numbers, and the spec bans identifiers that could be valid.
# - the third party designee, signature and paid preparer blocks (c2_17, c2_18, f2_37 to f2_51): the
#   book's returns are unsigned and unreviewed, with no designee or preparer.

